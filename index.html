<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123c58">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #193247;
        --muted: #526879;
        --blue: #176b87;
        --teal: #31a99a;
        --paper: #ffffff;
        --background: #f2f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 85% 5%, rgba(49, 169, 154, 0.13), transparent 30rem),
          var(--background);
        font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.9;
      }

      main {
        width: min(100% - 2rem, 920px);
        margin: 0 auto;
        padding: clamp(2.5rem, 8vw, 6rem) 0;
      }

      header {
        position: relative;
        overflow: hidden;
        padding: clamp(2rem, 6vw, 4.5rem);
        border-radius: 1.5rem;
        color: #fff;
        background: linear-gradient(125deg, #123c58, #176b87 68%, #218d91);
        box-shadow: 0 18px 45px rgba(18, 60, 88, 0.17);
      }

      header::after {
        position: absolute;
        right: -3rem;
        bottom: -7rem;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        box-shadow: 0 0 0 2rem rgba(255, 255, 255, 0.05), 0 0 0 4rem rgba(255, 255, 255, 0.04);
        content: "";
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        color: #bcece4;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.3;
        letter-spacing: 0.04em;
      }

      section {
        margin-top: 2rem;
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid #e1eaed;
        border-radius: 1.25rem;
        background: var(--paper);
        box-shadow: 0 8px 24px rgba(25, 50, 71, 0.045);
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin: 0 0 1rem;
        font-size: 1.4rem;
      }

      h2::before {
        width: 0.35rem;
        height: 1.5rem;
        border-radius: 1rem;
        background: linear-gradient(var(--teal), var(--blue));
        content: "";
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 0.75rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding: 0.85rem 1rem 0.85rem 2.5rem;
        border: 1px solid #e3edef;
        border-radius: 0.75rem;
        color: var(--ink);
        background: #f8fbfb;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }

      li::before {
        position: absolute;
        top: 50%;
        left: 1rem;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--teal);
        content: "";
        transform: translateY(-50%);
      }

      li:hover {
        border-color: #9bd6ce;
        background: #f0faf8;
        transform: translateY(-2px);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">INFORMATION NETWORKING FOR INNOVATION AND DESIGN</p>
        <h1>INIADの紹介</h1>
      </header>

      <section aria-labelledby="overview-heading">
        <h2 id="overview-heading">概要</h2>
        <p>INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」を用いた学習にも取り組みます。</p>
      </section>

      <section aria-labelledby="subjects-heading">
        <h2 id="subjects-heading">科目群一覧</h2>
        <ul>
          <li>コンピュータ・システム</li>
          <li>コンピュータ・ソフトウェア</li>
          <li>ユーザ・エクスペリエンス</li>
          <li>データサイエンス</li>
          <li>ICT社会応用</li>
          <li>連携科目群</li>
          <li>ビジネス構築</li>
          <li>コミュニティ形成</li>
        </ul>
      </section>
    </main>
  </body>
</html>
